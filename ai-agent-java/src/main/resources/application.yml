server:
  port: 8080

# Ollama Configuration
ollama:
  base-url: http://localhost:11434
  model: llama3.1:8b     # Supports tool calling
  temperature: 0.7
  timeout: 120s

# Agent Configuration
agent:
  max-iterations: 10     # Prevent infinite loops
  verbose: true          # Log reasoning steps

spring:
  application:
    name: ai-agent
